name: i18n

# Three checks, all about the locales production actually serves.
#
# audit-keys verifies that every translation key referenced in code exists in the
# catalog it is resolved from. None of the three audits has a locale dimension,
# because every package here authors English and English only: each translated
# catalog is authored in the i18n repo, published from there to R2, and fetched at
# runtime, so no locale but `en` (plus the interpreters' `system` canary) is ever a
# file in this tree to check. That is why the interpreters audit no longer iterates
# PRODUCTION_LOCALES; the reasoning, and what guards a target locale instead, is in
# the header of interpreters/scripts/audit-i18n-keys.mjs. Each package has its own
# audit script under <pkg>/scripts/audit-i18n-keys.mjs.
#
# The division of labour is therefore: audit-keys guards the ENGLISH catalogs this
# repo authors, locale-completeness guards every other locale by asking the repo
# that owns them, and locale-check guards this repo's own account of which locales
# exist — that the language roster, the generated production list the deploy gate
# reads, and the inlined crash-page copy all still agree.
#
# locale-completeness verifies that each of those locales is one the i18n repo
# reports as fully translated. That repo publishes whatever is on its main so
# work in progress can be reviewed on staging, which means R2 is not evidence a
# locale is finished. Without this check, adding a locale to PRODUCTION_LOCALES
# is a judgement call that ships; with it, it is a claim CI can refuse.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "curriculum/**"
      - "interpreters/**"
      - ".github/workflows/i18n.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "curriculum/**"
      - "interpreters/**"
      - ".github/workflows/i18n.yml"

jobs:
  # Nothing may enter PRODUCTION_LOCALES that the i18n repo has not finished.
  # This reads the completeness record it publishes, so the gate is the other
  # repo's own account of its state rather than anyone's reading of R2.
  locale-completeness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Verify every production locale is complete
        working-directory: app
        run: node scripts/verify-locale-completeness.js

  # Everything a locale's existence implies inside this repo, asserted in one run.
  #
  # The roster (app/lib/i18n/language-registry.ts) is the single source of truth
  # and everything else is derived from it, but two of those derivations are
  # GENERATED FILES that have to be committed (the deploy gate and the production
  # build both read them without running any generator). A committed generated
  # file can be stale, so this regenerates and fails on any difference.
  #
  # It needs an install, unlike locale-completeness: it reads the roster by handing
  # it to the TypeScript compiler rather than by matching a regex against it, which
  # is the whole reason it can be trusted.
  #
  # There is no i18n checkout here, so the catalog-sourced checks run against the
  # committed generated copy and say so. A developer with the checkout gets the
  # stronger form of the same check.
  locale-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check every locale definition agrees
        working-directory: app
        run: pnpm run locale:check

  audit-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # Run every package's audit against the production locale set. Each script
      # exits non-zero and lists the missing keys if any are absent. We run all
      # of them and fail at the end so a single CI run surfaces every problem
      # across packages, not just the first.
      - name: Audit i18n keys (all packages)
        run: |
          set +e
          status=0

          echo "::group::interpreters"
          node interpreters/scripts/audit-i18n-keys.mjs
          [ $? -ne 0 ] && status=1
          echo "::endgroup::"

          echo "::group::curriculum"
          node curriculum/scripts/audit-i18n-keys.mjs
          [ $? -ne 0 ] && status=1
          echo "::endgroup::"

          echo "::group::app"
          node app/scripts/audit-i18n-keys.mjs
          [ $? -ne 0 ] && status=1
          echo "::endgroup::"

          if [ $status -ne 0 ]; then
            echo "::error::i18n audit found translation keys missing from a production locale. See the grouped output above for the specific keys."
          fi
          exit $status
