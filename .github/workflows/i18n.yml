name: i18n

# Two checks, both about the locales production actually serves.
#
# audit-keys verifies that every translation key referenced in code exists in the
# catalog it is resolved from. None of the three audits has a locale dimension,
# because every package here authors English and English only: each translated
# catalog is authored in the i18n repo, published from there to R2, and fetched at
# runtime, so no locale but `en` (plus the interpreters' `system` canary) is ever a
# file in this tree to check. That is why the interpreters audit no longer iterates
# PRODUCTION_LOCALES; the reasoning, and what guards a target locale instead, is in
# the header of interpreters/scripts/audit-i18n-keys.mjs. Each package has its own
# audit script under <pkg>/scripts/audit-i18n-keys.mjs.
#
# The division of labour is therefore: audit-keys guards the ENGLISH catalogs
# this repo authors, and locale-completeness guards every other locale by asking
# the repo that owns them, about THIS tree's English.
#
# locale-completeness runs the i18n repo's publisher against this checkout and
# fails if any production locale comes out incomplete. Main is always deployed,
# and the deploy runs the same script (`pnpm run deploy` -> `locales:verify`), so
# this is the deploy gate asked early: nothing may merge that the deploy would
# refuse. It is computed rather than read from the record i18n publishes to R2
# because that record is made against main, and a PR is not main: see the header
# of app/scripts/verify-locale-completeness.js.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "curriculum/**"
      - "interpreters/**"
      - ".github/workflows/i18n.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "curriculum/**"
      - "interpreters/**"
      - ".github/workflows/i18n.yml"

jobs:
  # Would every production locale be complete if this tree were main? Clones
  # the (public) i18n repo and runs its publisher with this checkout as the
  # English, so on a PR the English is the merge ref's, which is what main would
  # become. pnpm is for the i18n repo's install; the script does the rest.
  locale-completeness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Verify every production locale is complete for this tree
        working-directory: app
        run: node scripts/verify-locale-completeness.js

  audit-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # Run every package's audit against the production locale set. Each script
      # exits non-zero and lists the missing keys if any are absent. We run all
      # of them and fail at the end so a single CI run surfaces every problem
      # across packages, not just the first.
      - name: Audit i18n keys (all packages)
        run: |
          set +e
          status=0

          echo "::group::interpreters"
          node interpreters/scripts/audit-i18n-keys.mjs
          [ $? -ne 0 ] && status=1
          echo "::endgroup::"

          echo "::group::curriculum"
          node curriculum/scripts/audit-i18n-keys.mjs
          [ $? -ne 0 ] && status=1
          echo "::endgroup::"

          echo "::group::app"
          node app/scripts/audit-i18n-keys.mjs
          [ $? -ne 0 ] && status=1
          echo "::endgroup::"

          if [ $status -ne 0 ]; then
            echo "::error::i18n audit found translation keys missing from a production locale. See the grouped output above for the specific keys."
          fi
          exit $status
